<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件分享 - GitHub Drive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 600px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 32px; text-align: center; }
        .header-icon { font-size: 48px; margin-bottom: 12px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 24px; }
        .file-list { list-style: none; }
        .file-item { display: flex; align-items: center; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; transition: all 0.2s; cursor: pointer; }
        .file-item:hover { border-color: #667eea; background: #f8f7ff; transform: translateY(-1px); }
        .file-icon { font-size: 28px; margin-right: 14px; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-weight: 600; font-size: 14px; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .download-btn { background: #667eea; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .download-btn:hover { background: #5a67d8; }
        .download-all { width: 100%; margin-top: 16px; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .download-all:hover { transform: translateY(-1px); }
        .footer { padding: 16px 24px; border-top: 1px solid #e5e7eb; text-align: center; font-size: 12px; color: #9ca3af; }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">📦</div>
            <h1>文件分享</h1>
            <p>共 1 个文件 · 由 GitHub Drive 分享</p>
        </div>
        <div class="content">
            <ul class="file-list" id="fileList"></ul>
            <button class="download-all" onclick="downloadAll()">⬇️ 下载全部文件</button>
        </div>
        <div class="footer">
            由 <a href="https://github.com/Cool-zimo/github_drive" target="_blank">GitHub Drive</a> 强力驱动 · 存储于 GitHub
        </div>
    </div>
    <script>
        const files = [{"name":"20260627-184530.png","url":"https://raw.githubusercontent.com/Cool-zimo/share-mt7yt86q/main/20260627-184530.png"}];
        const fileList = document.getElementById('fileList');
        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = { jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',svg:'🖼️',webp:'🖼️',mp4:'🎬',avi:'🎬',mov:'🎬',mkv:'🎬',webm:'🎬',mp3:'🎵',wav:'🎵',flac:'🎵',aac:'🎵',ogg:'🎵',pdf:'📕',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📙',pptx:'📙',txt:'📄',md:'📝',zip:'📦',rar:'📦','7z':'📦',js:'📜',py:'🐍',html:'🌐',css:'🎨',json:'📋',exe:'⚙️',dmg:'💿',apk:'📱' };
            return icons[ext] || '📄';
        }
        files.forEach(file => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.onclick = () => window.open(file.url, '_blank');
            li.innerHTML = '<span class="file-icon">' + getFileIcon(file.name) + '</span><div class="file-info"><div class="file-name">' + file.name + '</div><div class="file-size">点击下载</div></div><button class="download-btn" onclick="event.stopPropagation();window.open(\'' + file.url + '\',\'_blank\')">下载</button>';
            fileList.appendChild(li);
        });
        function downloadAll() {
            files.forEach((file, i) => { setTimeout(() => window.open(file.url, '_blank'), i * 300); });
        }
    </script>
</body>
</html>
